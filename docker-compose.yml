# =============================================================================
# AgentHire — docker-compose.yml
# Multi-agent job search platform orchestration
# =============================================================================
#
# Usage:
#   docker compose up -d                    # start all services (no dashboard)
#   docker compose --profile dev up -d      # start all services + dashboard
#   docker compose logs -f agent-backend    # tail the backend

version: "3.9"

networks:
  agenthire_net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  n8n_data:

x-agent-env: &agent-env
  env_file: .env
  networks:
    - agenthire_net
  restart: unless-stopped

services:

  postgres:
    image: postgres:16-alpine
    container_name: agenthire_postgres
    <<: *agent-env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-agenthire}
      POSTGRES_USER: ${POSTGRES_USER:-agenthire}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/migrations:/migrations:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agenthire} -d ${POSTGRES_DB:-agenthire}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  redis:
    image: redis:7-alpine
    container_name: agenthire_redis
    <<: *agent-env
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  n8n:
    image: n8nio/n8n:latest
    container_name: agenthire_n8n
    <<: *agent-env
    ports:
      - "5679:5678"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB:-agenthire}
      DB_POSTGRESDB_USER: ${POSTGRES_USER:-agenthire}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      N8N_HOST: ${N8N_HOST:-localhost}
      N8N_PORT: ${N8N_PORT:-5678}
      N8N_PROTOCOL: http
      WEBHOOK_URL: ${N8N_WEBHOOK_URL:-http://localhost:5678}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:-changeme_32_char_key_here_!!!!!}
      GENERIC_TIMEZONE: America/Santiago
      TZ: America/Santiago
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n/workflows:/home/node/.n8n/workflows:ro

  agent-browser:
    build:
      context: ./browser
      dockerfile: Dockerfile
    container_name: agenthire_browser
    <<: *agent-env
    ports:
      - "8765:8765"
    volumes:
      - ./browser/sessions:/app/sessions
    environment:
      BROWSER_SESSIONS_DIR: /app/sessions
    cap_add:
      - SYS_ADMIN
    security_opt:
      - seccomp:unconfined
    shm_size: "2gb"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8765/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  agent-backend:
    build:
      context: .
      dockerfile: ./agents/Dockerfile
    container_name: agenthire_backend
    <<: *agent-env
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      agent-browser:
        condition: service_healthy
    volumes:
      - ./outputs:/app/outputs
      - ./templates:/app/templates:ro
      - ./prompts:/app/prompts:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: agenthire_dashboard
    env_file: .env
    profiles:
      - dev
    networks:
      - agenthire_net
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_TRACKER_URL: http://localhost:8000/tracker
      DISCOVERY_URL: http://agent-backend:8000/discovery
      RANKING_URL: http://agent-backend:8000/ranking
      CV_URL: http://agent-backend:8000/cv
      COVER_URL: http://agent-backend:8000/cover
      APPLY_URL: http://agent-backend:8000/apply
      TRACKER_URL: http://agent-backend:8000/tracker
    depends_on:
      - agent-backend
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
